name: CI/CD Pipeline - {{ cookiecutter.project_slug }}

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - develop
          - staging
          - production
      version_bump:
        description: "Version bump type (if auto-increment)"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  REGISTRY: ghcr.io
  OWNER: {{ cookiecutter.github_owner }}

jobs:
  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{{ cookiecutter.python_version }}"

      - name: Build MkDocs site (strict)
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict -f docs/mkdocs.yml

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/site

  build-and-push:
    name: Build & Push {{ cookiecutter.project_slug }} Image
    runs-on: ubuntu-latest
    environment:
      name: {% raw %}${{ github.event.inputs.environment || github.ref_name }}{% endraw %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
{% raw %}
      - name: Get latest version and auto-increment
        if: github.event_name == 'workflow_dispatch'
        id: version
        run: |
          chmod +x .github/scripts/get-version.sh
          .github/scripts/get-version.sh \
            "${{ github.event.inputs.release_version || '' }}" \
            "${{ github.event.inputs.version_bump || 'patch' }}"

      - name: Set Git Commit SHA as Tag
        run: echo "IMAGE_TAG_DEV=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Define environment & version
        run: |
          ENVIRONMENT=${{ github.event.inputs.environment || github.ref_name }}

          case "$ENVIRONMENT" in
{% endraw %}            develop)     IMAGE_NAME={{ cookiecutter.project_slug }}-dev ;;
            staging)     IMAGE_NAME={{ cookiecutter.project_slug }}-stg ;;
            production)  IMAGE_NAME={{ cookiecutter.project_slug }}-prod ;;
{% raw %}            *)           echo "Unsupported environment: $ENVIRONMENT" && exit 1 ;;
          esac

          VERSION=${{ github.event_name == 'workflow_dispatch' && steps.version.outputs.NEW_VERSION || env.IMAGE_TAG_DEV }}

          cat >> $GITHUB_ENV <<EOF
          ENVIRONMENT=$ENVIRONMENT
          VERSION=$VERSION
          IMAGE_NAME=$IMAGE_NAME
          Frontend=${REGISTRY}/${OWNER}/${IMAGE_NAME}:${VERSION}
          Frontend_LATEST=${REGISTRY}/${OWNER}/${IMAGE_NAME}:latest
          EOF

          echo "frontend:${REGISTRY}/${OWNER}/${IMAGE_NAME}:${VERSION}" > image.txt
          echo "Environment: $ENVIRONMENT | Version: $VERSION | Image: $IMAGE_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-info
          path: image.txt

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.TOKEN }}

      - name: Build & push image
        run: |
          docker build \
            -t $Frontend \
            -t $Frontend_LATEST \
            -f Dockerfile \
            .
          docker push $Frontend
          docker push $Frontend_LATEST

      - name: Clean up pipeline images
        if: always()
        run: |
          if [ -f .github/scripts/cleanup-images.sh ]; then
            chmod +x .github/scripts/cleanup-images.sh
            .github/scripts/cleanup-images.sh \
              "${{ env.REGISTRY }}" \
              "${{ env.OWNER }}" \
              "${{ env.IMAGE_NAME }}" \
              "${{ env.Frontend }}" \
              "${{ env.Frontend_LATEST }}"
          else
            echo "Cleanup script not found, skipping"
          fi

  create-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-and-push
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        run: |
          chmod +x .github/scripts/get-version.sh
          .github/scripts/get-version.sh \
            "${{ github.event.inputs.release_version || '' }}" \
            "${{ github.event.inputs.version_bump || 'patch' }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.NEW_VERSION }}
          name: "${{ github.event.inputs.environment }} Release v${{ steps.get_version.outputs.NEW_VERSION }}"
          generate_release_notes: true
{% endraw %}